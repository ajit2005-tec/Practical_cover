<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PracticalCover</title>
<meta name="description" content="Create a clean, print-ready A4 practical record cover with editable student, branch, semester, and subject details.">
<meta name="theme-color" content="#285A8E">
<meta property="og:title" content="PracticalCover"><meta property="og:description" content="Create a clean, print-ready A4 practical record cover.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23285A8E'/%3E%3Crect x='17' y='10' width='30' height='44' rx='2' fill='%23fff'/%3E%3Crect x='22' y='18' width='20' height='3' fill='%23285A8E'/%3E%3Crect x='22' y='25' width='14' height='2' fill='%23A9683D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--blue:#285A8E;--bg:#F5F8FC;--ink:#172A3A;--sub:#62768A;--cu:#A9683D;--bd:#D8E2ED;--w:#fff;--surf:#fff;--desk:#E6ECF3;color-scheme:light}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1A26;--ink:#E8EEF5;--sub:#9DB0C3;--bd:#2A3B4D;--surf:#16263A;--desk:#0B141E;--blue:#5B93CC;color-scheme:dark}}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
a{color:inherit}
:focus-visible{outline:3px solid var(--cu);outline-offset:2px;border-radius:4px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0px)}
nav .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;text-decoration:none;margin-right:auto}
.brand img{height:38px;width:auto}
.nl{text-decoration:none;font-weight:500;color:var(--sub);padding:8px 10px}.nl:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--blue);background:var(--blue);color:#fff;font:600 15px Outfit,sans-serif;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(40,90,142,.3)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--blue)}
.btn:disabled{opacity:.6;cursor:wait}
@media(max-width:640px){.nl{display:none}}
.hero{position:relative;overflow:hidden;padding:56px 0 72px;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:32px 32px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}}
h1{font-size:clamp(38px,6vw,68px);line-height:1.03;margin:12px 0 16px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--blue)}
.lead{font-size:18px;color:var(--sub);max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}
.chip{border:1px solid var(--bd);background:var(--surf);padding:6px 12px;border-radius:99px}
.desk{position:relative;height:420px;perspective:900px}
.paper{position:absolute;left:50%;top:50%;width:260px;aspect-ratio:210/297;background:#fff;color:#172A3A;border:1px solid #cfd9e5;box-shadow:0 30px 50px rgba(23,42,58,.25),0 4px 10px rgba(23,42,58,.15);transform:translate(-50%,-50%) rotate(-4deg) translate(var(--px,0),var(--py,0));transition:transform .2s ease-out;padding:18px;text-align:center;animation:rise .9s ease both}
.paper.b{transform:translate(-50%,-50%) rotate(5deg) translate(calc(var(--px,0)*-1.6),calc(var(--py,0)*-1.6)) translateX(60px);background:#EEF3F9;opacity:.9;animation-delay:.15s}
.paper img{width:70px;margin:6px auto;display:block}
.paper i{display:block;height:6px;background:var(--blue);margin:8px auto;border-radius:2px}
.paper i.c{background:var(--cu);width:50%;height:3px}
@keyframes rise{from{opacity:0;margin-top:40px}to{opacity:1;margin-top:0}}
.fade{animation:rise .8s ease both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.intro{padding:64px 0 24px;text-align:center}
.intro h2{font-size:clamp(28px,4vw,42px);margin:8px 0;letter-spacing:-.01em}
.intro p{max-width:600px;margin:0 auto 18px;color:var(--sub)}
.gen{padding:24px 0 64px}
.grid{display:grid;grid-template-columns:minmax(320px,460px) 1fr;gap:28px;align-items:start}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(23,42,58,.05)}
fieldset{border:0;padding:0;margin:0 0 18px;min-width:0}
legend{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--cu);padding:0 0 8px;border-bottom:1px solid var(--bd);width:100%;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:460px){.row{grid-template-columns:1fr}}
label{display:block;font-size:13px;font-weight:500;margin-bottom:10px;color:var(--sub)}
input,select{display:block;width:100%;height:44px;margin-top:4px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--ink);font:400 15px Outfit,sans-serif}
input:focus,select:focus{border-color:var(--blue);outline:2px solid color-mix(in srgb,var(--blue) 30%,transparent)}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tpl button{padding:6px 8px}
.tpl button{min-height:44px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);border-radius:8px;font:500 14px Outfit,sans-serif;cursor:pointer}
.tpl button[aria-pressed=true]{border-color:var(--blue);background:var(--blue);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar div{display:flex;gap:10px;flex-wrap:wrap}
.tog{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:14px;color:var(--ink)}.tog input{width:20px;height:20px;margin:0}
.stage{background:var(--desk);border:1px solid var(--bd);border-radius:14px;padding:20px;position:sticky;top:78px}
@media(max-width:980px){.stage{position:static}}
#holder{width:100%;position:relative;overflow:hidden}
#sheet{width:794px;height:1123px;background:#fff;color:#0E1F3D;position:absolute;top:0;left:0;transform-origin:top left;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden;font-family:Georgia,'Times New Roman',serif;animation:rise .4s ease both}
#sheet *{overflow-wrap:anywhere}
.how{padding:56px 0;background:var(--surf);border-top:1px solid var(--bd)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:20px}
.step b{font-family:'IBM Plex Mono',monospace;color:var(--cu)}
footer{padding:28px 0 36px;border-top:1px solid var(--bd);text-align:center;color:var(--sub);font-size:14px}
footer strong{color:var(--ink)}
.note{font-size:12px;color:var(--sub);margin:12px 0 0}
@page{size:A4 portrait;margin:0}
@media print{
 html,body{background:#fff!important;margin:0;height:auto;overflow:visible}
 body *{visibility:hidden!important}
 #holder,#holder *{visibility:visible!important}
 #holder{position:fixed!important;left:0;top:0;width:210mm!important;height:297mm!important;overflow:hidden}
 #sheet{transform:none!important;width:210mm!important;height:297mm!important;box-shadow:none!important;animation:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head>
